<style>
:root{--pr:#2f8fe8;--pd:#1b6fc4;--bg:#f4f9ff;--ac:#e3f1ff;--bd:#d6e8fb;--tx:#10294a;--mu:#5f7694;--rd:#d94646}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--pd)}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd b{font-size:18px;margin-right:auto}.hd b small{color:var(--pr);font-weight:600;font-size:12px;margin-left:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

      const g=groups[n];say(`Menganalisis ${n+1} dari ${groups.length}: ${g.name}`);
      const fs=subs.length?await gl(g.id):top;
      const imgs=fs.filter(f=>(f.mimeType||'').startsWith('image/')).slice(0,5),tx=fs.find(f=>f.mimeType==='text/plain'||f.mimeType==='application/vnd.google-apps.document');
      if(!imgs.length)continue;
      const blobs=[];for(const f of imgs)blobs.push(await gb(f.id));
      const notes=tx?await gt(tx):'';
      let ai={};
      try{
        const small=await Promise.all(blobs.slice(0,3).map(async b=>b64((await shrink(b,640,true))[0])));
        const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name:g.name,notes,images:small,categories:cats.map(c=>c.name)})});
        ai=await r.json();if(!r.ok){aiFail=ai.error||'AI tidak merespons';ai={}}
      }catch(e){aiFail=e.message||'AI tidak merespons'}
      IM.push({blobs,name:ai.name||g.name,desc:ai.description||'',price:ai.price??'',cat:(cats.find(c=>c.name===ai.category)||{}).id||'',on:true});
    }
    if(!IM.length)return say('Tidak ada foto ditemukan di folder itu.',1);
    say(aiFail?`AI tidak bisa dipakai (${aiFail}). Data diisi dari nama folder, silakan lengkapi manual.`:'Selesai dianalisis. Periksa dulu sebelum diunggah.',!!aiFail);
    review();
  }catch(e){say(e.message||String(e),1)}
  $('#ds').disabled=false;
}
function review(){
  $('#dr').innerHTML=`<h3>Periksa hasil (${IM.length} produk)</h3>`+IM.map((m,i)=>`<div class="rv"><div style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-i="${i}" data-k="on" ${m.on?'checked':''}><div class="pl" style="margin:0">${m.blobs.map(b=>`<img src="${URL.createObjectURL(b)}" alt="">`).join('')}</div></div><label>Nama</label><input data-i="${i}" data-k="name" value="${esc(m.name)}"><label>Harga (Rp)${m.price===''?' – belum terisi, mohon isi':''}</label><input type="number" inputmode="decimal" data-i="${i}" data-k="price" value="${esc(m.price)}"><label>Kategori</label><select data-i="${i}" data-k="cat"><option value="">– Tanpa kategori –</option>${cats.map(c=>`<option value="${c.id}" ${c.id===m.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Deskripsi</label><textarea rows="2" data-i="${i}" data-k="desc">${esc(m.desc)}</textarea></div>`).join('')+`<button class="btn" id="di">${ic('plus')} Upload ke katalog</button>`;
  $('#dr').oninput=e=>{const t=e.target,i=t.dataset.i;if(i!==undefined)IM[i][t.dataset.k]=t.type==='checkbox'?t.checked:t.value};
  $('#di').onclick=async()=>{
    const sel=IM.filter(m=>m.on&&String(m.name).trim());let ok=0;$('#di').disabled=true;
    for(const m of sel){say(`Mengupload ${ok+1} dari ${sel.length}: ${m.name}`);
      try{const photos=[];for(const b of m.blobs)photos.push(await up(b));
        const r=await sb.from('products').insert({name:m.name.trim(),description:m.desc||null,price:m.price===''?0:+m.price,category_id:m.cat?+m.cat:null,photos,in_stock:true,active:true});if(r.error)throw r.error;ok++}
      catch(e){say('Gagal pada "'+m.name+'": '+(e.message||e),1);$('#di').disabled=false;return}}
    say(`Selesai! ${ok} produk ditambahkan ke katalog.`);IM=[];$('#dr').innerHTML='';
  };
}
/* ===== Impor dari Excel ===== */
let XR=[];
function excel(){
  XR=[];
  $('#mn').innerHTML=`<div class="bar"><h2>Impor dari Excel</h2></div><div class="rv" style="line-height:1.6"><b>Format file</b><br><small style="color:var(--mu)">Baris pertama berisi judul kolom: <b>nama</b>, <b>kategori</b>, <b>deskripsi</b>. Kolom <b>harga</b> boleh ditambahkan (opsional). Satu baris = satu produk. Kategori yang belum ada akan dibuat otomatis. Foto ditambahkan sesudahnya lewat tab Produk, tombol Edit.</small><div style="margin-top:10px"><button class="btn s" id="xt">${ic('sheet')} Unduh template Excel</button></div></div><label>Pilih file Excel (.xlsx, .xls, atau .csv)</label><input type="file" id="xf" accept=".xlsx,.xls,.csv"><div class="msg" id="dm"></div><div id="dr"></div>`;
  $('#xt').onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([['nama','kategori','deskripsi','harga'],['Fin Carbon Longfins','Diving','Fin freediving karbon, ringan dan responsif.',850000]]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Produk');XLSX.writeFile(wb,'template-produk-vina-finds.xlsx')};
  $('#xf').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const col=(r,k)=>{const x=Object.keys(r).find(y=>y.trim().toLowerCase()===k);return x?r[x]:''};
      XR=rows.map(r=>{const pv=col(r,'harga');return{name:String(col(r,'nama')).trim(),cat:String(col(r,'kategori')).trim(),desc:String(col(r,'deskripsi')).trim(),price:typeof pv==='number'?pv:String(pv).replace(/[^\d]/g,'')}}).filter(r=>r.name);
      if(!XR.length){$('#dr').innerHTML='';return say('Tidak ada data terbaca. Pastikan baris pertama berisi judul kolom: nama, kategori, deskripsi.',1)}
      say(`${XR.length} produk terbaca. Periksa dulu sebelum diimpor.`);xreview();
    }catch(x){say('File tidak bisa dibaca: '+(x.message||x),1)}
  };
}
function xreview(){
  const known=n=>cats.some(c=>c.name.toLowerCase()===n.toLowerCase());
  $('#dr').innerHTML=`<h3>Pratinjau (${XR.length} produk)</h3>`+XR.slice(0,50).map(r=>`<div class="row"><div><b>${esc(r.name)}${r.cat?`<span class="pill ${known(r.cat)?'':'o'}">${esc(r.cat)}${known(r.cat)?'':' (baru)'}</span>`:''}</b><small>${esc(r.desc)||'Tanpa deskripsi'}${r.price!==''?' · '+rp(r.price):''}</small></div></div>`).join('')+(XR.length>50?`<div class="empty">…dan ${XR.length-50} produk lainnya</div>`:'')+`<button class="btn" id="xi" style="margin-top:8px">${ic('plus')} Impor ${XR.length} produk</button>`;
  $('#xi').onclick=ximport;
}
async function ximport(){
  $('#xi').disabled=true;
  try{
    let list=[...cats];
    const need=[...new Set(XR.map(r=>r.cat).filter(c=>c&&!list.some(x=>x.name.toLowerCase()===c.toLowerCase())))];
    if(need.length){const r=await sb.from('categories').insert(need.map((name,i)=>({name,sort:list.length+i}))).select();if(r.error)throw r.error;list=list.concat(r.data)}
    const rows=XR.map(r=>({name:r.name,description:r.desc||null,price:r.price===''?0:+r.price,category_id:(list.find(x=>x.name.toLowerCase()===r.cat.toLowerCase())||{}).id||null,photos:[],in_stock:true,active:true}));
    for(let i=0;i<rows.length;i+=100){const r=await sb.from('products').insert(rows.slice(i,i+100));if(r.error)throw r.error}
    say(`Selesai! ${rows.length} produk ditambahkan. Tambahkan foto lewat tab Produk, tombol Edit.`);XR=[];$('#dr').innerHTML='';cats=(await sb.from('categories').select('*').order('sort')).data||[];
  }catch(e){say('Gagal: '+(e.message||e),1);$('#xi').disabled=false}
}
/* ===== Dashboard, Pesanan, Invoice ===== */
const ST={pending:'Pending',ordered:'Ordered',arrived:'Arrived',completed:'Completed'},NX={pending:['ordered','Ordered'],ordered:['arrived','Arrived'],arrived:['completed','Complete']},PS={pending:'Pending',dp:'DP',lunas:'Payment'};
let OR=[];
const dt=d=>new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
async function dash(){
  const [o,p]=await Promise.all([sb.from('orders').select('*'),sb.from('products').select('id')]);
  const O=o.data||[],cnt=s=>O.filter(x=>x.stage===s).length,m={};
  O.forEach(x=>(x.items||[]).forEach(i=>m[i.name]=(m[i.name]||0)+(+i.qty||0)));
  const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const K=[['Total Produk',(p.data||[]).length],['Total Customer',new Set(O.map(x=>x.customer_wa)).size],['Total Pesanan',O.length],['Pending',cnt('pending')],['Ordered',cnt('ordered')],['Arrived',cnt('arrived')],['Completed',cnt('completed')],['Total Omset',rp(O.reduce((a,x)=>a+Number(x.paid||0),0))]];
  $('#mn').innerHTML=`<div class="bar"><h2>Dashboard</h2></div><div class="kg">${K.map(k=>`<div class="kp"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><h3>Produk Terlaris</h3>${top.map((t,i)=>`<div class="row"><div><b>${i+1}. ${esc(t[0])}</b></div><span class="pill">${t[1]} terjual</span></div>`).join('')||'<div class="empty">Belum ada pesanan.</div>'}<small style="color:var(--mu)">Total omset dihitung dari pembayaran yang sudah kamu catat di menu Pesanan.</small>`;
}
let OF='all',OS=new Set();
async function orders(load=true){
  const y=scrollY;
  if(load){OR=(await sb.from('orders').select('*').order('created_at',{ascending:false})).data||[];OS.clear()}
  const L=OR.filter(o=>OF==='all'||(OF==='unpaid'?o.pay_status==='pending':o.stage===OF));
  const fl=[['all','Semua'],['unpaid','Belum bayar'],['pending','Pending'],['ordered','Ordered'],['arrived','Arrived'],['completed','Completed']];
  $('#mn').innerHTML=`<div class="bar"><h2>Pesanan (${L.length})</h2><button class="btn r" id="dsel" style="display:none"></button></div><div class="tabs" style="margin-bottom:12px">${fl.map(f=>`<button class="tab ${OF===f[0]?'on':''}" data-of="${f[0]}">${f[1]}</button>`).join('')}</div>`+(L.length?`<label class="chk" style="margin:0 0 10px"><input type="checkbox" id="oall"> Pilih semua yang tampil</label>`:'')+(L.map(o=>{const n=NX[o.stage];return `<div class="row" style="flex-wrap:wrap"><input type="checkbox" data-os="${o.id}" ${OS.has(o.id)?'checked':''}><div><b>${esc(o.po)} <span class="pill ${o.pay_status==='pending'?'o':''}">${PS[o.pay_status]||o.pay_status}</span><span class="pill o">${ST[o.stage]||o.stage}</span></b><small>${esc(o.customer_name)} · ${esc(o.customer_wa)} · ${dt(o.created_at)}<br>Total ${rp(o.total)} · Dibayar ${rp(o.paid)}</small></div>${n?`<button class="btn s" data-stg="${o.id}">${n[1]}</button>`:''}<button class="btn" data-inv="${o.id}">Invoice</button><button class="btn r" data-odel="${o.id}" title="Hapus pesanan">${ic('trash')}</button></div>`}).join('')||'<div class="empty">Tidak ada pesanan di filter ini. Pesanan muncul otomatis saat customer menekan Pesan via WhatsApp.</div>');
  selUI();scrollTo(0,y);
}
function selUI(){
  const L=OR.filter(o=>OF==='all'||(OF==='unpaid'?o.pay_status==='pending':o.stage===OF)),b=$('#dsel'),a=$('#oall');
  if(b){b.style.display=OS.size?'inline-flex':'none';b.innerHTML=`${ic('trash')} Hapus terpilih (${OS.size})`}
  if(a)a.checked=L.length>0&&L.every(o=>OS.has(o.id));
}
async function delOrders(ids){
  const done=OR.filter(o=>ids.includes(o.id)&&o.stage==='completed').length;
  if(!confirm(`Hapus ${ids.length} pesanan? Tindakan ini tidak bisa dibatalkan.`+(done?`\n\n${done} pesanan sudah Completed. Jumlah terjual produk dan omset dari pesanan itu ikut hilang dari dashboard (angka terjual pada produk tidak dikurangi).`:'')))return;
  const r=await sb.from('orders').delete().in('id',ids);if(r.error)return alert('Gagal menghapus: '+r.error.message);
  orders();
}
async function stg(id){
  const o=OR.find(x=>x.id==id),n=NX[o.stage];if(!n)return;
  const r=await sb.from('orders').update({stage:n[0]}).eq('id',id);if(r.error)return alert(r.error.message);
  if(n[0]==='completed')for(const i of o.items||[]){const q=await sb.from('products').select('sold').eq('id',i.id).maybeSingle();if(q.data)await sb.from('products').update({sold:(q.data.sold||0)+(+i.qty||0)}).eq('id',i.id)}
  orders();
}
function inv(id){
  const o=OR.find(x=>x.id==id);if(!o)return;const sisa=Math.max(0,o.total-o.paid),row=(a,b,s='')=>`<div style="display:flex;justify-content:space-between;${s}"><span>${a}</span><span>${b}</span></div>`;
  const txt=`Halo ${o.customer_name}, berikut invoice ${o.po} dari Vina Finds:\n`+(o.items||[]).map(i=>`- ${i.name}${i.size?' ('+i.size+')':''} x${i.qty} = ${rp(i.price*i.qty)}`).join('\n')+`\n\nTotal: ${rp(o.total)}\nDibayar: ${rp(o.paid)}\nSisa: ${rp(sisa)}\nStatus: ${PS[o.pay_status]}\n\nTerima kasih!`;
  $('#sh').innerHTML=`<div id="invp"><h2 style="margin:0">VINA FINDS</h2><small style="color:var(--mu)">INVOICE</small><div style="margin:12px 0;line-height:1.6"><b>${esc(o.po)}</b><br>${dt(o.created_at)}<br>Kepada: ${esc(o.customer_name)} (${esc(o.customer_wa)})</div><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mu)"><th>Produk</th><th>Qty</th><th style="text-align:right">Subtotal</th></tr>${(o.items||[]).map(i=>`<tr><td style="padding:6px 0">${esc(i.name)}${i.size?' ('+esc(i.size)+')':''}<br><small>${rp(i.price)}</small></td><td>${i.qty}</td><td style="text-align:right">${rp(i.price*i.qty)}</td></tr>`).join('')}</table><hr>${row('<b>Total</b>','<b>'+rp(o.total)+'</b>')}${(o.payments||[]).map(p=>row('Pembayaran '+dt(p.date)+(p.note?' – '+esc(p.note):''),rp(p.amount),'color:var(--mu);font-size:13px')).join('')}${row('Dibayar',rp(o.paid))}${row('<b>Sisa</b>','<b>'+rp(sisa)+'</b>')}<p><span class="pill">${PS[o.pay_status]}</span></p></div><hr><label>Catat pembayaran masuk (Rp)</label><input id="pa" type="number" inputmode="numeric"><label>Catatan (opsional, mis. DP 50%)</label><input id="pn"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-pay="${o.id}">Simpan pembayaran</button><button class="btn s" onclick="print()">Cetak / PDF</button><a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${o.customer_wa}?text=${encodeURIComponent(txt)}">Kirim ke WhatsApp</a><button class="btn s" onclick="document.getElementById('ov').classList.remove('on')">Tutup</button></div>`;
  $('#ov').classList.add('on');
}
async function pay(id){
  const o=OR.find(x=>x.id==id),a=+$('#pa').value;if(!(a>0))return alert('Isi jumlah pembayaran.');
  const pays=[...(o.payments||[]),{date:new Date().toISOString(),amount:a,note:$('#pn').value.trim()}],paid=pays.reduce((x,y)=>x+y.amount,0);
  const r=await sb.from('orders').update({payments:pays,paid,pay_status:paid>=o.total?'lunas':'dp'}).eq('id',id);if(r.error)return alert(r.error.message);
  await orders();inv(id);
}
document.addEventListener('click',e=>{
  const g=a=>e.target.closest('['+a+']');
  if(g('data-stg'))stg(g('data-stg').dataset.stg);
  if(g('data-inv'))inv(g('data-inv').dataset.inv);
  if(g('data-pay'))pay(g('data-pay').dataset.pay);
  if(g('data-of')){OF=g('data-of').dataset.of;OS.clear();orders(false)}
  if(g('data-odel'))delOrders([+g('data-odel').dataset.odel]);
  if(e.target.id==='dsel')delOrders([...OS]);
  if(e.target.id==='oall'){const L=OR.filter(o=>OF==='all'||(OF==='unpaid'?o.pay_status==='pending':o.stage===OF));L.forEach(o=>e.target.checked?OS.add(o.id):OS.delete(o.id));document.querySelectorAll('[data-os]').forEach(c=>c.checked=e.target.checked);selUI()}
  if(g('data-os')){const c=g('data-os'),id=+c.dataset.os;c.checked?OS.add(id):OS.delete(id);selUI()}
});
start();
</script></body></html>
