  const cv=t.catCovers||{};C=(a.C||[]).map(c=>({...c,image:cv[nk(c.name)]||c.image||''}));
  const cn=id=>(C.find(c=>c.id===id)||{}).name||'',idOf=u=>(String(u).match(/\/d\/([^=\/?]+)/)||[])[1]||u,ov=t.P||{};
  P=(a.P||[]).map(p=>{const o=ov[nk(cn(p.category_id))+'::'+nk(p.name)];if(!o)return p;let ph=p.photos||[];
    if(o.order&&o.order.length){const m=new Map(ph.map(u=>[idOf(u),u])),f=o.order.map(i=>m.get(i)).filter(Boolean);ph=[...f,...ph.filter(u=>!f.includes(u))]}
    return{...p,photos:ph,description:'description' in o?o.description:p.description,mats:o.mats||[],ship:o.ship||[],noship:!!o.noship,type:o.type||'po'}});
  B=(t.B||a.B||[]).filter(b=>b.active!==false);T=(t.T||a.T||[]);G=t.guides||DEF.guides;FQ=t.faq||DEF.faq;
  R=(t.R||a.R||[]).map(r=>({...r,photos:r.photo?[r.photo]:(r.photos||[])}));
  if(!Array.isArray(S.ship_opts))S.ship_opts=t.ship_opts||DEF.ship_opts;
  if(t.ship_opts)S.ship_opts=t.ship_opts;
}

  const c=gg('data-c');if(c){cat=+c.dataset.c;render();if(!/^#(p-|rent)/.test(location.hash))$('#katalog').scrollIntoView({behavior:'smooth'});return}
  const o=gg('data-o');if(o){location.hash='#p-'+o.dataset.o;return}
  const ad=gg('data-add');if(ad){const p=P.find(x=>x.id==ad.dataset.add);if(szs(p).length||mats(p).length||ships(p).length)location.hash='#p-'+p.id;else{addCart(p.id,{});const h=ad.innerHTML;ad.textContent='Ditambahkan';setTimeout(()=>ad.innerHTML=h,900)}return}
  const sz=gg('data-g');if(sz){const k=sz.dataset.g,v=sz.dataset.v;sel[k]=v;sz.parentNode.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',b===sz));const l=$('#sl_'+k);if(l)l.textContent='– '+v;$('#er').textContent='';
    if(k==='ship'){const p=P.find(x=>x.id==sel.id),s=ships(p).find(x=>x.n===v);$('#shn').textContent=s&&s.note||''}updPrice();return}
  if(gg('data-dadd')){const p=P.find(x=>x.id==sel.id),m=missing(p);if(m.length){$('#er').style.color='#d94646';$('#er').textContent='Pilih '+m.join(', ')+' dulu.';return}addCart(p.id,sel,sel.qty||1);$('#er').style.color='#1b8a4a';$('#er').textContent='Ditambahkan ke keranjang.';return}
  if(gg('data-buy')){const p=P.find(x=>x.id==sel.id),m=missing(p);if(m.length){$('#er').style.color='#d94646';$('#er').textContent='Pilih '+m.join(', ')+' dulu.';return}checkout([{p,size:sel.size,mat:sel.mat,ship:sel.ship,qty:sel.qty||1}]);return}
  if(gg('data-co')){checkout(cartItems(),1);return}
  const mi=gg('data-m');if(mi){const k=mi.dataset.m;if(--cart[k]<=0)delete cart[k];saveCart();count();showCart();return}
  const pl=gg('data-pl');if(pl){cart[pl.dataset.pl]++;saveCart();count();showCart();return}
  if(gg('data-qm')){sel.qty=Math.max(1,(sel.qty||1)-1);$('#qv').textContent=sel.qty;return}
  if(gg('data-qp')){sel.qty=Math.min(99,(sel.qty||1)+1);$('#qv').textContent=sel.qty;return}
  if(t.dataset.t){$('#mm').innerHTML=`<img src="${t.dataset.t}" alt="">`;document.querySelectorAll('.pt img').forEach(i=>i.classList.toggle('on',i===t))}
});
function route(){
  const h=location.hash.slice(1),r=h==='rent',pp=h.startsWith('p-');
  $('#pg-home').style.display=r||pp?'none':'';$('#pg-rent').style.display=r?'':'none';$('#pg-prod').style.display=pp?'':'none';
  if(!pp)document.title='Vina Finds | Dive Equipment';
  if(pp){prodPage(h.slice(2));scrollTo(0,0)}else if(r)scrollTo(0,0);else if(h){const e=document.getElementById(h);e&&e.scrollIntoView()}
}
addEventListener('hashchange',route);
$('#q').addEventListener('input',()=>{if(/^#(rent|p-)/.test(location.hash))location.hash='#katalog';render();if($('#q').value)$('#katalog').scrollIntoView()});
$('#so').addEventListener('change',render);
function down(){
  const w=WAN();
  $('#grid').innerHTML=`<div class="empty" style="line-height:1.7"><b style="color:var(--tx);font-size:17px">Katalog sedang dalam perawatan sementara</b><br>Mohon maaf atas ketidaknyamanannya. Kamu tetap bisa bertanya dan memesan langsung lewat WhatsApp.${w?`<br><a class="bt g" style="margin-top:14px;color:#fff" target="_blank" rel="noopener" href="https://wa.me/${w}">Chat WhatsApp</a>`:''}${DBG.length?`<small style="display:block;margin-top:14px;opacity:.7">Info teknis: ${esc(DBG.join(' · '))}</small>`:''}</div>`;
}
count();load().then(()=>{head();slides();po();render();extra();foot();route()}).catch(down);
</script></body></html>
